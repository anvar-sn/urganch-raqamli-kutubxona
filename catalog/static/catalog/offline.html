<!doctype html>
<html lang="uz" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#002f6c">
  <title>Server ulanishi — Raqamli kutubxona</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #141c2b;
      color: #f8fafc;
      font: 16px 'Inter', system-ui, -apple-system, sans-serif;
    }
    .box {
      max-width: 540px;
      margin: 20px;
      padding: 40px 36px;
      background: #1d273b;
      border: 1px solid #2d3b54;
      border-bottom: 4px solid #3b82f6;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #002f6c, #1e40af, #0d9488);
      color: #fff;
      font-weight: 800;
      font-size: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      line-height: 1.65;
      margin: 0 0 24px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a, button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font-size: 15px;
    }
    a.alt {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #384a69;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">BR</div>
    <h1>Kutubxona serveriga ulanmoqda…</h1>
    <p>
      Agar eski port (8000) Windows tomonidan band qilingan bo‘lsa, platforma faol <strong>http://127.0.0.1:8010</strong> manzilida ishlamoqda.
    </p>
    <div class="actions">
      <a href="http://127.0.0.1:8010/">⚡ Asosiy serverga o‘tish (8010-port)</a>
      <button type="button" onclick="clearSwAndReload()">↻ Keshni tozalab yangilash</button>
    </div>
  </main>
  <script>
    async function clearSwAndReload() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (e) {}
      window.location.href = 'http://127.0.0.1:8010/';
    }
    if (window.location.port === '8000') {
      clearSwAndReload();
    }
  </script>
</body>
</html>
